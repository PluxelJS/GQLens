    "react": "^19.3.0"
    "react-dom": "^19.3.0"
  example:
    "@elysiajs/node": "^1.4.5"
    "@logtape/logtape": "^2.2.3"
    "elysia": "^1.4.29"
    "graphql": "^16.14.2"
