name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install toolchain
        uses: jdx/mise-action@v5
        with:
          cache: true
          install: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Validate hooks
        run: hk validate

      - name: Restore Vite task cache
        uses: actions/cache@v6
        with:
          path: node_modules/.vite/task-cache
          key: gqlens-vp-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: gqlens-vp-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Verify
        run: vp run --concurrency-limit=2 workspace:verify
