name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install toolchain
        uses: jdx/mise-action@v5
        with:
          cache: false
          install: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Verify and publish all packages
        run: vp run --concurrency-limit=2 release-publish
        env:
          NPM_CONFIG_PROVENANCE: "true"

      - name: Upload publish summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pnpm-publish-summary
          path: pnpm-publish-summary.json
          if-no-files-found: ignore
